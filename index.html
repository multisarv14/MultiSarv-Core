<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0b0d12" />
    <title>Multisarv Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Firebase che default URL (multisarv-admin.web.app / .firebaseapp.com) → fakt core.multisarv.com.
      if (/^multisarv-admin\.(web\.app|firebaseapp\.com)$/.test(location.hostname)) {
        location.replace("https://core.multisarv.com" + location.pathname + location.search + location.hash);
      }
    </script>
    <script>
      // Theme flash talnyasathi React load honyaadhi.
      try {
        var l = localStorage.getItem("ms-lang");
        if (l) document.documentElement.lang = l;
        var t = localStorage.getItem("ms-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
